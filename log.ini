[loggers]
keys=root,uvicorn

[handlers]
keys=stream_handler,logfile

[formatters]
keys=formatter

[logger_root]
level=INFO
handlers=stream_handler,logfile

[logger_uvicorn]
level=INFO
handlers=stream_handler,logfile
propagate=0
qualname=uvicorn

[handler_stream_handler]
class=StreamHandler
level=DEBUG
formatter=formatter
args=(sys.stderr,)

[handler_logfile]
class=handlers.RotatingFileHandler
level=DEBUG
args=('/var/log/ada-slurm-manager/ada-slurm-manager.log', 'a', 10*1024*1024, 10)
formatter=formatter

[formatter_formatter]
format=%(asctime)s %(name)-12s %(levelname)-8s %(message)s